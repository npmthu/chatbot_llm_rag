services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_SERVICE_GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - chatbot-network

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://host.docker.internal:11434
      - CORS_ORIGINS=*
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - chatbot-network

volumes:
  qdrant_data:

networks:
  chatbot-network:
    driver: bridge
